Changes:
    - date: 2025-05-28
      description: |-
        Change to the Apache License 2.0
        Remove unused ActionExecConfig and ActionExec.
        Remove unused field ActionArgDefinition.deprecated.
      onprem: true
      cvaas: true
      version: 1.5.0

    - date: 2025-04-10
      description: |-
        Deprecate ActionExec, ActionExecConfig, and ACTION_LANGUAGE_PYTHON_2.

        Add ActionRun and ActionRunConfig that supersede ActionExec and ActionExecConfig.

        In support of the new ActionRun, add ActionRunKey.

        Documentation: no longer restrict use of flag `hidden` to only custom actions' arguments.

        Documentation: `stderr` contains a single message rather than the standard error stream.
        Often it contains a python traceback with multiple newline characters.
        In ActionExecResult, if field `code` equals 200, the field `stderr` may be ignored.

        Documentation: in ActionExecAudit, `created_at` is the same as `started_at`.

        Documentation: ActionExecResult is considered final once the state is no longer RUNNING.
      version: 1.4.0

    - date: 2023-03-29
      description: Add a new type of action ACTION_TYPE_STUDIO_BUILD_HOOK to support
        workspace pipeline customization
      version: 1.3.0

